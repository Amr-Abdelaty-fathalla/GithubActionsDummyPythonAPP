name: Python CI

# Events that will trigger workflow
on:
    push: 
        branches:
            - main
    
    pullrequest:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            # checkout code from repo
            - name: Check out code
              uses: actions/checkout@v2
            
            # setup py env
            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.8'

            # install dependencies
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            # run tests
            - name: Run tests
              run: pytest
            
